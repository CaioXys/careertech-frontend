<section class="ai-chat-full-page" aria-labelledby="ai-chat-full-title">
  <header class="ai-chat-page__header">
    <h1 id="ai-chat-full-title">Chat <span class="ai-chat-page__badge">IA</span></h1>
  </header>

  <div class="ai-chat-page__messages" data-chat-messages role="log" aria-live="polite" aria-relevant="additions">
    <p class="ai-chat-page__message ai-chat-page__message--student">Onde encontro os desafios da plataforma?</p>
    <p class="ai-chat-page__message ai-chat-page__message--assistant">Acesse Games para continuar desafios por matéria e iniciar o desafio diário.</p>
    <p class="ai-chat-page__message ai-chat-page__message--student">Como acompanho meu progresso?</p>
    <p class="ai-chat-page__message ai-chat-page__message--assistant">Na página Início, você pode ver sua consistência semanal, sequência atual e XP total.</p>
  </div>

  <form class="ai-chat-page__form" data-chat-form>
    <input class="ai-chat-page__input" type="text" data-chat-input aria-label="Digite sua mensagem" placeholder="Escreva sua mensagem" autocomplete="off" maxlength="1000">
    <button class="ai-chat-page__send" type="submit">Enviar</button>
  </form>
</section>

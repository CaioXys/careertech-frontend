<div class="app-layout" data-collapsed="false">
  <aside class="app-sidebar" data-sidebar aria-label="Navegação da CareerTech">
    <button
      class="app-sidebar__brand"
      type="button"
      data-sidebar-toggle
      aria-label="Recolher menu"
      aria-expanded="true"
      title="Recolher menu"
    >
      <img src="/favicon.svg" width="32" height="32" alt="" />
      <span data-brand-name>CareerTech</span>
    </button>

    <nav class="app-sidebar__nav" data-nav aria-label="Navegação principal"></nav>

    <footer class="app-sidebar__footer">
      <span class="app-sidebar__avatar-wrap" data-user-initials aria-hidden="true"></span>
      <div class="app-sidebar__user">
        <span>Bem-vindo(a) 👋</span>
        <strong data-user-name></strong>
      </div>
      <button
        class="app-sidebar__profile-toggle"
        type="button"
        data-profile-toggle
        aria-label="Abrir opções da conta"
        aria-expanded="false"
        aria-controls="account-menu"
        title="Opções da conta"
      >
        <img src="/assets/sidebar/caret.svg" width="20" height="20" alt="" />
      </button>
      <div class="app-sidebar__profile-menu" id="account-menu" data-profile-menu hidden>
        <a href="#/profile" data-profile-link>Meu perfil</a>
        <button type="button" data-logout>Sair</button>
      </div>
    </footer>
  </aside>

  <main class="app-layout__main" data-outlet></main>
</div>
